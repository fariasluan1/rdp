name: Moonlight Windows Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instalar Tailscale
        run: |
          choco install tailscale -y
          refreshenv

      - name: Conectar ao Tailscale
        shell: cmd
        run: |
          "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname=github-win-runner

      - name: Configurar Wallpaper
        shell: powershell
        run: |
          $rawUrl = "https://raw.githubusercontent.com/fariasluan1/rdp/main/wallpaper.jpg"
          $imgPath = "C:\Users\Public\wallpaper.jpg"
          
          Invoke-WebRequest -Uri $rawUrl -OutFile $imgPath

          if (Test-Path $imgPath) {
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name wallpaper -Value $imgPath
              rundll32.exe user32.dll, UpdatePerUserSystemParameters 1, True
          }

      - name: Instalar e Iniciar Sunshine
        shell: powershell
        run: |
          # Instalação do Sunshine
          choco install sunshine --no-progress -y
          
          # Regras completas de Firewall para Áudio/Vídeo do Moonlight
          New-NetFirewallRule -DisplayName "Sunshine Web UI" -Direction Inbound -LocalPort 47990 -Protocol TCP -Action Allow
          New-NetFirewallRule -DisplayName "Sunshine Stream TCP" -Direction Inbound -LocalPort 47984,47989,47999,48010 -Protocol TCP -Action Allow
          New-NetFirewallRule -DisplayName "Sunshine Stream UDP" -Direction Inbound -LocalPort 47998,47999,48000,48002,48010 -Protocol UDP -Action Allow

          # Executa o Sunshine e aguarda 5 segundos para inicializar os drivers
          Start-Process -FilePath "C:\Program Files\Sunshine\sunshine.exe" -ArgumentList "--bind-address=0.0.0.0"
          Start-Sleep -Seconds 5
          
          # Mantém o workflow rodando
          while ($true) { Start-Sleep -Seconds 60 }
